<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teacher's Day!</title>
    <!-- Include Three.js via CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Three.js Canvas Container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 3D Card Container (Larger Dimensions) */
        .card-container {
            position: relative;
            width: 500px;
            height: 650px;
            perspective: 2000px;
            z-index: 2;
        }

        /* The Flipping Wrapper */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        /* Flip Action on Hover */
        .card-container:hover .card {
            transform: rotateY(-180deg);
        }

        /* Front and Back Cards */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 40px;
            border: 10px solid rgba(255, 255, 255, 0.9);
        }

        /* Front Side Styling (Glassmorphism effect over Three.js) */
        .card-front {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.85), rgba(162, 155, 254, 0.85));
            backdrop-filter: blur(10px);
            color: white;
        }

        /* Back Side Styling */
        .card-back {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #2d3436;
            transform: rotateY(180deg);
            box-shadow: inset 0 0 50px rgba(108, 92, 231, 0.1);
            border-color: #ffffff;
        }

        /* Floating 3D-Like Emoji Container */
        .illustration {
            position: relative;
            font-size: 110px;
            margin-top: 20px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        /* Typography */
        h1 {
            font-size: 3.2rem;
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 6px 12px rgba(0,0,0,0.2);
            line-height: 1.1;
        }

        h2 {
            font-size: 2.2rem;
            color: #6c5ce7;
            margin-bottom: 15px;
            font-weight: 800;
            text-align: center;
        }

        .hint {
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.25);
            padding: 10px 24px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            animation: pulse 2s infinite;
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Back Card Content Layout */
        .message-body {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .quote {
            font-style: italic;
            color: #55595c;
            line-height: 1.7;
            font-size: 1.3rem;
            font-weight: 500;
        }

        .heart {
            color: #e84393;
            font-size: 45px;
            animation: beat 0.7s infinite alternate;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes beat {
            to { transform: scale(1.25); }
        }

        .signature {
            font-weight: 700;
            color: #2d3436;
            margin-top: 15px;
            font-size: 1.4rem;
            text-align: center;
        }

        .ribbon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
        }
    </style>
</head>
<body>

    <!-- Three.js Interactive Background Container -->
    <div id="canvas-container"></div>

    <!-- Main Card Container -->
    <div class="card-container">
        <div class="card">
            
            <!-- FRONT OF THE CARD -->
            <div class="card-front">
                <div class="ribbon">👑</div>
                <div class="illustration">✨📚🍎</div>
                <h1>Happy<br>Teacher's<br>Day!</h1>
                <div class="hint">Move mouse to view / Hover to flip 🌟</div>
            </div>

            <!-- BACK OF THE CARD -->
            <div class="card-back">
                <div class="ribbon">🎓</div>
                
                <div class="message-body">
                    <h2>Thank You, Teacher!</h2>
                    <p class="quote">"A truly special teacher is very wise, and sees tomorrow in every student's eyes."</p>
                    <div class="heart">❤️</div>
                    <p class="quote" style="font-style: normal; color: #2d3436;">Your guidance, patience, and creative lessons spark our curiosity every single day.</p>
                </div>

                <div class="signature">
                    With endless gratitude, <br>
                    <span style="color: #6c5ce7; font-size: 1.6rem;">Your Class</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Three.js Interactive Space Script -->
    <script>
        let scene, camera, renderer, starGeo, stars;
        let mouseX = 0, mouseY = 0;

        function init() {
            const container = document.getElementById('canvas-container');
            
            // Create Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1;
            camera.rotation.x = Math.PI / 2;

            // Initialize Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Generate Star Field (Particles)
            starGeo = new THREE.BufferGeometry();
            const starCount = 3000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            const colorPalette = [
                new THREE.Color(0xa29bfe), // Purple
                new THREE.Color(0x81ecec), // Teal
                new THREE.Color(0xff7675), // Soft Red
                new THREE.Color(0xffeaa7)  // Soft Yellow
            ];

            for (let i = 0; i < starCount * 3; i += 3) {
                // Random positions in space
                positions[i] = Math.random() * 600 - 300;
                positions[i+1] = Math.random() * 600 - 300;
                positions[i+2] = Math.random() * 600 - 300;

                // Random colors from the preset palette
                const mixedColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i] = mixedColor.r;
                colors[i+1] = mixedColor.g;
                colors[i+2] = mixedColor.b;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Particle Material
            let starMaterial = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);

            // Add Event Listeners
            document.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        // Capture Mouse Interaction
        function onMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.0005;
        }

        // Handle Responsive Window Resizing
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Subtle rotation of particle field
            stars.rotation.y += 0.002;
            
            // Parallax movement tied to user's mouse
            stars.rotation.x += (mouseY - stars.rotation.x) * 0.05;
